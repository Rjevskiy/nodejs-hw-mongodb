tags:
  - Contacts
summary: Оновити контакт
operationId: updateContact
description: Оновлює дані контакту за ID
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    description: ID контакту
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/Contact.yaml'
responses:
  '200':
    description: Контакт оновлено
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/Contact.yaml'
  '404':
    $ref: '../../components/responses/NotFound.yaml'
