tags:
  - Contacts
summary: Додати новий контакт
operationId: createContact
description: Створює новий контакт для користувача
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/ContactCreate/ContactCreate.yaml'

responses:
  '201':
    description: Контакт успішно створено
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/Contact.yaml'  
  '400':
    description: Некоректні дані
  '401':
    $ref: '../components/responses/Unauthorized.yaml'
  '404':
    $ref: '../components/responses/NotFound.yaml'
