openapi: 3.0.0
info:
  title: Contacts API
  version: 1.0.0

servers:
  - url: https://nodejs-hw-mongodb-1m6g.onrender.com/api-docs/

tags:
  - name: Contacts
    description: Операції з контактами

paths:
  /contacts:
    get:
      tags:
        - Contacts
      summary: Отримати всі контакти
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успішна відповідь
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './components/schemas/Contact.yaml'
    post:
      tags:
        - Contacts
      summary: Додати новий контакт
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/ContactCreate.yaml'
      responses:
        '201':
          description: Контакт створено
          content:
            application/json:
              schema:
                $ref: './components/schemas/Contact.yaml'
        '400':
          description: Некоректні дані
        '401':
          $ref: './components/responses/Unauthorized.yaml'

  /contacts/{contactId}:
    parameters:
      - name: contactId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Contacts
      summary: Отримати контакт за ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Контакт знайдено
          content:
            application/json:
              schema:
                $ref: './components/schemas/Contact.yaml'
        '404':
          $ref: './components/responses/NotFound.yaml'
    patch:
      tags:
        - Contacts
      summary: Оновити контакт за ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Контакт оновлено
          content:
            application/json:
              schema:
                $ref: './components/schemas/Contact.yaml'
        '404':
          $ref: './components/responses/NotFound.yaml'
    delete:
      tags:
        - Contacts
      summary: Видалити контакт за ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Контакт видалено
        '404':
          $ref: './components/responses/NotFound.yaml'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Contact:
      $ref: './components/schemas/Contact.yaml'
    ContactCreate:
      $ref: './components/schemas/ContactCreate.yaml'
  responses:
    NotFound:
      $ref: './components/responses/NotFound.yaml'
    Unauthorized:
      $ref: './components/responses/Unauthorized.yaml'
