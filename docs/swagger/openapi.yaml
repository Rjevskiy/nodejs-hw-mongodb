openapi: 3.0.0
info:
  title: Contacts API
  version: 1.0.0

servers:
  - url: https://nodejs-hw-mongodb-1m6g.onrender.com/api-docs/

tags:
  - name: Contacts
    description: Операції з контактами

paths:
  /contacts:
    get:
      tags:
        - Contacts
      summary: Отримати всі контакти
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успішна відповідь
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'
    post:
      tags:
        - Contacts
      summary: Додати новий контакт
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreate'
      responses:
        '201':
          description: Контакт створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          description: Некоректні дані
        '401':
          $ref: '#/components/responses/Unauthorized'

  /contacts/{contactId}:
    parameters:
      - name: contactId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Contacts
      summary: Отримати контакт за ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Контакт знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Contacts
      summary: Оновити контакт за ID
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreate'
      responses:
        '200':
          description: Контакт оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Contacts
      summary: Видалити контакт за ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Контакт видалено
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ContactCreate:
      type: object
      required:
        - name
        - email
        - phone
      properties:
        name:
          type: string
          example: John Doe
        email:
          type: string
          example: johndoe@example.com
        phone:
          type: string
          example: +123456789
        favorite:
          type: boolean
          example: false

    Contact:
      type: object
      required:
        - name
        - email
        - phone
      properties:
        _id:
          type: string
          example: 66020f354a67de001f22d91f
        name:
          type: string
          example: John Doe
        email:
          type: string
          example: johndoe@example.com
        phone:
          type: string
          example: +123456789
        favorite:
          type: boolean
          example: true

  responses:
    NotFound:
      description: Контакт не знайдено
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Contact not found

    Unauthorized:
      description: Неавторизований доступ
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Not authorized
