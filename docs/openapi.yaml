openapi: 3.0.0

info:
  title: Контактна Книга
  version: 1.0.0
  description: >
    Це API для керування контактами. Дозволяє створювати, оновлювати, видаляти та переглядати контакти.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

tags:
  - name: Contacts
    description: Операції з контактами

servers:
  - url: http://localhost:3000
    description: Local server
  - url: https://your-deployed-site.com
    description: Deployed server

paths:
  /contacts:
    get:
      $ref: './paths/contacts/get.yaml'
    post:
      $ref: './paths/contacts/post.yaml'
  /contacts/{contactId}:
    get:
      $ref: './paths/contacts/{id}/get.yaml'
    patch:
      $ref: './paths/contacts/{id}/patch.yaml'
    delete:
      $ref: './paths/contacts/{id}/delete.yaml'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Contact:
      $ref: './components/schemas/Contact.yaml'

  responses:
    NotFound:
      $ref: './components/responses/NotFound.yaml'
